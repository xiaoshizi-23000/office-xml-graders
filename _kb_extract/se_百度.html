<!-- loadScript -->
<script>
function ieOnEnd(script,cb){script.onreadystatechange=function(){if(this.readyState!=='complete'&&this.readyState!=='loaded'){return}this.onreadystatechange=null;cb(null,script)}}function stdOnEnd(script,cb){script.onload=function(){this.onerror=this.onload=null;cb(null,script)};script.onerror=function(e){this.onerror=this.onload=null;cb(new Error(`Failed to load ${this.src}`),script)}}function loadScript(src,opts,cb){var script=document.createElement('script');if(typeof opts==='function'){cb=opts;opts={}}opts=opts||{};cb=cb||function(){};script.type=opts.type||'text/javascript';script.charset=opts.charset||'utf8';script.async='async'in opts?!!opts.async:true;script.src=src;if(opts.attrs){setAttributes(script,opts.attrs)}if(opts.text){script.text=''+opts.text}var onend='onload'in script?stdOnEnd:ieOnEnd;onend(script,cb);if(!script.onload){stdOnEnd(script,cb)}document.head.appendChild(script)}
</script>
<script>
(function () {
    var mainOrigin = 'https://bioc-static.cdn.bcebos.com';
    var standbyOrigin = 'https://bioc-static-su-standby.cdn.bcebos.com';
    var disasterOrigin = '/v1/webapi/static';
    var biocFacadePath = '/pages/BiocFacade.js';
    var bootstrapPath = '/pages/302.js';
    var loadAssetsWithStandby = function (path, cb) {
        loadScript(mainOrigin + path, function (err) {
            if (err) {
                loadScript(standbyOrigin + path, function (err) {
                    if (err) {
                        loadScript(disasterOrigin + path, cb);
                        return;
                    }
                    cb();
                });
                return;
            }
            cb();
        });
    };
    var loadBioc = function (cb) {
        loadAssetsWithStandby(biocFacadePath, cb);
    };
    var loadBootstrap = function (cb) {
        loadAssetsWithStandby(bootstrapPath, cb);
    };
    var handlerError = function (err) {
        alert('页面加载失败，请刷新页面重试');
        console.error(err);
    };
    loadBioc(function (err) {
        if (err) {
            handlerError(err);
            return;
        }
        loadBootstrap(function (err) {
            if (err) {
                handlerError(err);
            }
        });
    });
})()
</script>
