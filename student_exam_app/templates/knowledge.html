<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--mute:#64748b;--amber:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 -apple-system,"Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
.hd h1{font-size:22px;margin:0}
.hd p{color:var(--mute);font-size:13px;margin:4px 0 0}
.copyright{background:#f1f5f9;border:1px solid var(--line);border-radius:7px;padding:8px 12px;margin:12px 0 0;font-size:12px;color:var(--mute);line-height:1.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s}
.tabs button:hover{border-color:var(--amber);color:#b45309}
.tabs button.on{background:#0f172a;border-color:#0f172a;color:#fff;font-weight:600}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.head{padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.head:hover{background:#fffdf7}
.head .idx{font-size:11px;color:#b45309;background:#fffbeb;border-radius:5px;padding:2px 7px;flex-shrink:0;margin-top:3px}
.head .tt{flex:1;min-width:0}
.head h2{font-size:16px;margin:0}
.head .one{font-size:13px;color:var(--mute);margin-top:3px}
.head .cat{font-size:11px;color:#b45309;background:#fffbeb;border-radius:10px;padding:2px 9px;flex-shrink:0;margin-top:3px}
.head .arrow{color:#cbd5e1;flex-shrink:0}
.item[open] .arrow{transform:rotate(90deg)}
.body{padding:0 18px 18px;border-top:1px solid var(--line)}
.analogy{background:#fffbeb;border-left:3px solid var(--amber);padding:10px 14px;margin:14px 0;border-radius:0 7px 7px 0;font-size:14px;color:#78350f}
.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px;margin:12px 0;font-size:13px;color:#1e40af}
.win7{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 16px;margin:14px 0}
.win7 h3{font-size:14px;color:#15803d;margin:0 0 8px}
.win7 ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.9;color:#14532d}
.kp{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin:12px 0}
.kp b{color:#92400e;font-size:13px}
.kp ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:#78350f;line-height:1.85}
.prose{font-size:14px;line-height:2;color:#334155}
.prose h4{font-size:14px;font-weight:700;color:#92400e;margin:22px 0 10px;padding:6px 0 6px 11px;border-left:3px solid var(--amber);background:#fffbeb}
.prose p{margin:0 0 14px}
.prose img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin:8px auto 0;box-shadow:0 1px 4px rgba(15,23,42,.06)}
.fig{margin:16px 0;text-align:center}
.fig-cap{font-size:12px;color:var(--mute);margin-bottom:4px}
.prose ul,.prose ol{padding-left:22px;margin:8px 0}
.prose strong{color:#0f172a}
.pits{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;margin:14px 0;font-size:13px}
.pits b{color:#b91c1c}
.pits ul{margin:5px 0 0;padding-left:18px;color:#7f1d1d}
.qa{margin-top:14px}
.qa details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.qa summary{padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600}
.qa .a{padding:0 12px 10px;font-size:13px;color:#334155}
.src{font-size:12px;color:var(--mute);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
footer{margin-top:30px;text-align:center;color:var(--mute);font-size:12px}
footer a{color:#64748b;text-decoration:none}
@media(max-width:640px){.head{padding:13px}.body{padding:0 13px 15px}.head .cat{display:none}}

<body>
{% include "nav.html" %}
<div class="wrap">
  <div class="hd"><h1>知识库</h1><p>四川省 2023 版计算机类考纲 · 41 个专题，点开看图解与操作路径</p></div>
  <div class="copyright">本页文字与图片整理自公开考试大纲及教材，部分图片来源于网络，仅用于学习交流。若涉及版权问题，请联系我们，核实后将立即删除。</div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <footer>资料整理自公开考纲与教材，图片部分来自网络，仅作学习交流；如有版权问题请联系删除。<br>依据四川省普通高校对口招生职业技能考试大纲（2023 年版）整理 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2026015465号-2</a></footer>
</div>
<script>
var DATA=[],cur='all';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function initTabs(){
  var t=document.getElementById('tabs'),cats=[];
  DATA.forEach(function(x){if(cats.indexOf(x.cat)<0)cats.push(x.cat);});
  var b=document.createElement('button');b.className='on';b.textContent='全部';b.onclick=function(){cur='all';render();};t.appendChild(b);
  cats.forEach(function(c){var x=document.createElement('button');x.textContent=c;x.onclick=function(){cur=c;render();};t.appendChild(x);});
}
function render(){
  document.querySelectorAll('#tabs button').forEach(function(b){b.className=(cur==='all'?b.textContent==='全部':b.textContent===cur)?'on':'';});
  var items=DATA.filter(function(x){return cur==='all'||x.cat===cur;}),html='';
  items.forEach(function(x,i){
    html+='<details class="item"><summary class="head"><span class="idx">'+(i+1)+'</span><span class="tt"><h2>'+esc(x.title)+'</h2><span class="one">'+esc(x.one)+'</span></span><span class="cat">'+esc(x.cat)+'</span><span class="arrow">▸</span></summary><div class="body">';
    if(x.analogy) html+='<div class="analogy">'+esc(x.analogy)+'</div>';
    if(x.win7&&x.win7.length){
      html+='<div class="win7"><h3>考纲环境（Windows 7 / Office 2010）里的操作路径</h3><ol>';
      x.win7.forEach(function(s){html+='<li>'+esc(s)+'</li>';});
      html+='</ol></div>';
    }
    var kps=(x.syllabus_points&&x.syllabus_points.length)?x.syllabus_points:(x.keypoints||[]);
    if(kps.length){
      html+='<div class="kp"><b>本专题覆盖的考纲知识点（'+kps.length+' 条）</b><ul>'+kps.map(function(k){return '<li>'+esc(k)+'</li>';}).join('')+'</ul></div>';
    }
    if(x.html){
      html+='<div class="notice">下面是教材原文与配图，环境为 Windows 10 / Office 2016。原理相同，界面路径请以上面的考纲环境为准。</div>';
      html+='<div class="prose">'+x.html+'</div>';
    }else if(x.body){html+='<div class="prose">'+esc(x.body)+'</div>';}
    if(x.pits&&x.pits.length){html+='<div class="pits"><b>容易踩的坑</b><ul>'+x.pits.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div>';}
    if(x.qa&&x.qa.length){
      html+='<div class="qa"><h3 style="font-size:14px;color:#b45309;margin:0 0 7px">常见问答</h3>';
      x.qa.forEach(function(q){html+='<details><summary>'+esc(q.q)+'</summary><div class="a">'+esc(q.a)+'</div></details>';});
      html+='</div>';
    }
    html+='</div></details>';
  });
  document.getElementById('list').innerHTML=html;
}
fetch('/api/topics').then(function(r){return r.json();}).then(function(d){DATA=d.items||[];initTabs();render();}).catch(function(){document.getElementById('list').textContent='加载失败，请刷新重试';});
</script>
</body>
</html>
