<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打字练习 · 中英文录入真题 - 小狮子刷题</title>
<meta name="description" content="四川中职对口升学技能高考中英文录入真题打字练习，逐字校对，实时统计正确率、速度和用时。">
<link rel="canonical" href="https://web.xiaoshizi.asia/typing">
<link rel="icon" type="image/png" href="/static/logo.png">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"LearningResource","name":"中英文录入真题打字练习","description":"技能高考中英文录入题原文练习，逐字校对并实时统计正确率与速度。","url":"https://web.xiaoshizi.asia/typing","inLanguage":"zh-CN","learningResourceType":"打字练习","educationalLevel":"中职","isPartOf":{"@type":"WebSite","name":"小狮子刷题","url":"https://web.xiaoshizi.asia/"}}
</script>
<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--mute:#64748b;--amber:#f59e0b;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 -apple-system,"Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.head a{color:#1b5c96;text-decoration:none;font-size:13px}
.intro{color:var(--mute);font-size:13px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px 28px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.stats b{display:block;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.text{font-size:20px;line-height:2.15;letter-spacing:.6px;color:#94a3b8;user-select:none;min-height:130px}
.text span{border-radius:2px;transition:color .08s}
.text span.ok{color:var(--green)}
.text span.no{color:var(--red);background:#fef2f2;text-decoration:underline}
.text span.cur{background:#fef3c7;box-shadow:0 0 0 1px #fcd34d}
.input{width:100%;margin-top:22px;padding:14px 16px;font:17px/1.7 inherit;border:2px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--ink);transition:border-color .15s}
.input:focus{border-color:var(--amber)}
.input::placeholder{color:#cbd5e1}
.bar{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
button{padding:9px 18px;border:1px solid var(--line);background:#fff;color:#334155;border-radius:8px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--amber);color:#b45309}
.note{font-size:12px;color:var(--mute)}
.result{margin-top:20px;padding:18px 20px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;display:none}
.result.on{display:block}
.result h2{margin:0 0 6px;font-size:17px}
.result p{margin:4px 0;font-size:14px;color:#78350f}
footer{margin-top:24px;text-align:center;color:var(--mute);font-size:12px}
footer a{color:#64748b}
@media(max-width:600px){.stats b{font-size:20px}.text{font-size:18px}.card{padding:20px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>中英文录入练习</h1><a href="/">← 回到题库</a><a href="/windows">Windows 操作题</a><a href="/faq">常见问题</a></div>
  <p class="intro">技能高考打字真题（题号 53）。考试占 10 分，照原文准确输入，别只求快。输入时逐字校对，错了会标红。</p>
  <div class="card">
    <div class="stats">
      <div><b id="acc">100%</b><span>正确率</span></div>
      <div><b id="speed">0</b><span>字/分钟</span></div>
      <div><b id="time">0s</b><span>用时</span></div>
      <div><b id="prog">0/304</b><span>进度</span></div>
    </div>
    <div class="text" id="text"></div>
    <input class="input" id="input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="点这里开始照着原文输入…">
    <div class="bar"><button id="reset">重新开始</button><span class="note">按原文输入，包括数字和标点。练习只在本地进行，不上传。</span></div>
    <div class="result" id="result"><h2>打完了</h2><p id="resultText"></p></div>
  </div>
  <footer>小狮子刷题 · 打字真题练习 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2026015465号-2</a></footer>
</div>
<script>
var RAW = '人民币的编号由" 冠字+号码" 的方式组成。第三套人民币冠字为罗马字母，而第四套人民币冠字字母则为两位大写英文字母（26个字母 去V，剩下25个字母）。它们自由组合，或者自己与自己组合，共625种组合方式。不同的字母排列方式会形成不同的分组，作为货币印 及投放的依据。由于第五套人民币已成为我国流通货币的主体，第四套人民币只剩下1角、5角仍在陆续发行中，其旧的冠字号码投放已 接近尾声。为了适应继续发行的需要，从2010年开始，第四套1角、5角纸币的编号出现了类似于" A0A000001" 的排列方式。这也与第五 人民币，以及2005年版5、10元的编号排列类似。通过人民币印刷工艺变通，可以国民经济趋势。';
var box = document.getElementById('text');
var input = document.getElementById('input');
var resetBtn = document.getElementById('reset');
var result = document.getElementById('result');
var spans = [];
var started = 0, timer = null, done = false;

for (var i = 0; i < RAW.length; i++) {
  var s = document.createElement('span');
  s.textContent = RAW[i];
  box.appendChild(s);
  spans.push(s);
}

function paint() {
  var val = input.value;
  var ok = 0;
  for (var i = 0; i < spans.length; i++) {
    var el = spans[i];
    el.className = '';
    if (i < val.length) {
      if (val[i] === RAW[i]) { el.className = 'ok'; ok++; }
      else el.className = 'no';
    }
    if (i === val.length && !done) el.className += ' cur';
  }
  var secs = started ? (Date.now() - started) / 1000 : 0;
  var acc = val.length ? Math.round(ok / val.length * 100) : 100;
  document.getElementById('acc').textContent = acc + '%';
  document.getElementById('speed').textContent = secs > 1 ? Math.round(ok / secs * 60) : 0;
  document.getElementById('time').textContent = Math.round(secs) + 's';
  document.getElementById('prog').textContent = val.length + '/' + RAW.length;
  var cur = spans[Math.min(val.length, spans.length - 1)];
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'center', behavior:'smooth'});
  if (val.length >= RAW.length && !done) finish(ok);
}

function finish(ok) {
  done = true;
  clearInterval(timer);
  input.blur();
  var secs = started ? (Date.now() - started) / 1000 : 0;
  var acc = Math.round(ok / RAW.length * 100);
  var speed = Math.round(ok / Math.max(secs, 1) * 60);
  document.getElementById('acc').textContent = acc + '%';
  document.getElementById('speed').textContent = speed;
  document.getElementById('resultText').textContent =
    '正确 ' + ok + ' / ' + RAW.length + ' 字，准确率 ' + acc + '%，用时 ' + Math.round(secs) + ' 秒，速度 ' + speed + ' 字/分钟。' +
    (acc >= 95 ? '这个水平考试稳得住。' : '先把准确率练到 95% 以上，再提速度。');
  result.classList.add('on');
}

input.addEventListener('input', function () {
  if (done) return;
  if (!started) {
    started = Date.now();
    timer = setInterval(paint, 500);
  }
  paint();
});
input.addEventListener('paste', function (e) { e.preventDefault(); });
resetBtn.addEventListener('click', function () {
  input.value = '';
  started = 0;
  done = false;
  clearInterval(timer);
  result.classList.remove('on');
  paint();
  input.focus();
});
paint();
</script>
</body>
</html>
