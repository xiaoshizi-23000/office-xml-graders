<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 操作题 · 分类练习与判分</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b;
          --blue:#1b5c96; --green:#15803d; --red:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.7 "Microsoft YaHei",sans-serif; }
  .head { background:linear-gradient(135deg,#0f172a,#1e293b); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .head h1 { font-size:16px; margin:0; }
  .head a { margin-left:auto; color:#cbd5e1; text-decoration:none; font-size:13px; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px 14px 60px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:#fff; color:#334155; padding:8px 16px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:13.5px; }
  .tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .card h2 { font-size:14.5px; margin:0 0 10px; color:var(--blue); }
  .hint { color:var(--muted); font-size:12.5px; line-height:1.95; }
  .hint b { color:#334155; }
  .grp { margin-top: 6px; }
  .grp .gh { display:flex; align-items:center; gap:10px; padding:8px 0 6px; border-bottom:1px solid #e6eef6; }
  .grp .gname { font-size:13.5px; font-weight:700; color:#12385c; }
  .grp .gmeta { font-size:11.5px; color:#64748b; }
  .grp .gdl { margin-left:auto; font-size:12.5px; color:#1b5c96; text-decoration:none; border:1px solid #bfdbfe; background:#eff6ff; padding:5px 12px; border-radius:7px; }
  .grp .gdl:hover { background:#dbeafe; }

  .q { padding:12px 0 14px; border-bottom:1px solid #f1f5f9; }
  .qhead { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .qhead b { font-size:13px; color:#0f172a; }
  .qhead span { font-size:11.5px; color:#64748b; }
  .qitems { margin:0 0 8px; padding:0; }
  .qitems li { list-style:none; position:relative; padding-left:11px; color:#334155; font-size:12.5px; line-height:1.85; }
  .qitems li::before { content:'·'; position:absolute; left:0; color:#94a3b8; }

  .drop { display:flex; align-items:center; justify-content:center; border:1px dashed #cbd5e1; border-radius:9px; background:#fbfdff; padding:11px; cursor:pointer; transition:.15s; }
  .drop:hover, .drop.over { border-color:#f59e0b; background:#fffbeb; }
  .drop .dtext { color:#94a3b8; font-size:12.5px; }
  .drop input { display:none; }

  .result { display:none; margin-top:10px; border:1px solid #dbeafe; background:#f8fbff; border-radius:10px; padding:12px 14px; }
  .result.on { display:block; }
  .result h3 { margin:0 0 8px; font-size:13.5px; color:#0c4a6e; }
  .r { display:flex; gap:8px; padding:5px 0; border-top:1px dashed #e2e8f0; font-size:12.5px; }
  .r:first-of-type { border-top:none; }
  .r .m { width:16px; font-weight:700; }
  .r .t { flex:1; line-height:1.75; }
  .r .v { color:#64748b; font-size:11.5px; }
  .ok{color:var(--green)} .bad{color:var(--red)} .todo{color:#b45309}
  .sum { margin-top:8px; padding-top:8px; border-top:2px solid #dbeafe; font-size:13px; }
  .sum b { font-size:20px; color:var(--blue); }
  @media (max-width:640px) {
    .q { flex-wrap:wrap; }
    .q .acts { flex-direction:row; width:100%; }
    .q .acts a, .q .acts button { flex:1; }
    .q .no { width:auto; }
  }
</style>
</head>
<body>
<div class="head">
  <h1>Windows 操作题</h1>
  <a href="/">← 回到题库</a>
</div>

<div class="wrap">
  <div class="card">
    <h2>怎么用</h2>
    <div class="hint">
      每道题后面有【下载程序】——只下这道题要用的那一个（1 个 exe + 同目录配置，一百多 KB）。<br>
      解压 → 按题目改设置 → 双击 exe 打开仿真控制面板做完 → 关掉 → 把同目录生成的那个<b>同名无扩展名文件</b>传上来判分。<br>
      <b style="color:#b45309">要重做这道题，直接删掉程序目录里生成的那个文件即可</b>——下次运行程序会自动重新生成一份干净的记录，不用重新下载。<br>
      <b style="color:#b45309">同一个类型只下一次就够了</b>：比如第 10、24、289 题都是「Internet 选项」，下一份 iesxWin7 就够，后面这些题直接用同一个程序做完再上传，不用每题重复下载。
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="on" data-k="网络">网络类（{{ sections['网络']|length }} 题）</button>
    <button data-k="Windows">系统类（{{ sections['Windows']|length }} 题）</button>
  </div>

  <div class="card" id="list"></div>
</div>

<input type="file" id="picker" style="display:none">

<script>
const DATA = {{ sections|tojson }};
const GROUPS = {{ groups|tojson }};
let curSection = '网络';
const PROG_NAME = {
  iesxWin7:'Internet 选项', wangluoWin7:'网络/IPv4', bhsxWin7:'宽带连接', jlljWin7:'连接向导',
  qyszWin7:'区域和语言', rwlsxWin7:'任务栏', xianshiWin7:'显示/主题', srfWin7:'输入法',
  tjdyjWin7:'打印机', outlook:'邮件'
};

function renderTabs() {
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.k === curSection);
    b.onclick = () => { curSection = b.dataset.k; renderTabs(); renderList(); };
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderList() {
  const groups = GROUPS[curSection] || [];
  document.getElementById('list').innerHTML =
    '<h2>' + curSection + '（' + (DATA[curSection] || []).length + ' 题，每个类型 5 题）</h2>' +
    groups.map(g => {
      const rows = g.items.map(qCard).join('');
      return '<div class="grp"><div class="gh">' +
        '<span class="gname">' + esc(PROG_NAME[g.prog] || g.prog) + '</span>' +
        '<span class="gmeta">' + g.items.length + ' 题 · ' + esc(g.prog) + '.exe</span>' +
        '<a class="gdl" href="/windows/prog/' + g.prog + '.zip">⬇ 下载程序</a>' +
        '</div>' + rows + '</div>';
    }).join('');
}

function qCard(q) {
  const items = q.texts.map(t => '<li>' + esc(t) + '</li>').join('');
  const id = String(q.id);
  return '<div class="q">' +
    '<div class="qhead"><b>' + esc(q.title) + '</b><span>' + q.score + ' 分</span></div>' +
    '<ul class="qitems">' + items + '</ul>' +
    '<div class="drop" id="d' + id + '" data-qid="' + id + '">' +
    '<span class="dtext">把程序生成的文件拖到这里，或点击上传</span>' +
    '<input type="file" class="dfile">' +
    '</div>' +
    '<div class="result" id="r' + id + '"></div>' +
    '</div>';
}

document.addEventListener('click', e => {
  const drop = e.target.closest('.drop');
  if (drop && !e.target.classList.contains('dfile')) drop.querySelector('.dfile').click();
});

document.addEventListener('change', e => {
  if (!e.target.classList.contains('dfile')) return;
  const drop = e.target.closest('.drop');
  if (e.target.files.length) upload(e.target.files[0], drop.dataset.qid);
  e.target.value = '';
});

['dragover', 'dragleave', 'drop'].forEach(evt => {
  document.addEventListener(evt, e => {
    const drop = e.target.closest && e.target.closest('.drop');
    if (!drop) return;
    e.preventDefault();
    if (evt === 'dragover') drop.classList.add('over');
    if (evt === 'dragleave') drop.classList.remove('over');
    if (evt === 'drop') {
      drop.classList.remove('over');
      if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0], drop.dataset.qid);
    }
  });
});

async function upload(f, qid) {
  const box = document.getElementById('r' + String(qid));
  box.classList.add('on');
  box.innerHTML = '<h3>正在读取 ' + esc(f.name) + ' …</h3>';
  const fd = new FormData();
  fd.append('file', f);
  fd.append('qid', String(qid));
  try {
    const r = await fetch('/api/windows/check', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) { box.innerHTML = '<h3 class="bad">' + esc(d.error || '判分失败') + '</h3>'; return; }
    renderResult(box, d);
  } catch (err) {
    box.innerHTML = '<h3 class="bad">上传失败：' + esc(err) + '</h3>';
  }
}

function renderResult(box, d) {
  const max = d.full || 0;
  const shown = d.score;
  const map = { ok:['ok','✓'], bad:['bad','✗'], todo:['todo','·'] };
  box.innerHTML = '<h3>' + esc(d.title) + ' · 得分 ' + shown + ' / ' + max + '（卷面 ' + (d.total_score || 10) + ' 分）</h3>' +
    d.items.filter(it => it.status !== 'step').map(it => {
      const m = map[it.status] || ['todo','·'];
      let extra;
      if (it.status === 'ok') extra = '当前值：' + esc(it.actual);
      else if (it.status === 'bad') extra = '当前值 ' + esc(it.actual) + '　要求 ' + esc(it.expect);
      else extra = '待人工核对（未配置比对值）';
      return '<div class="r"><span class="m ' + m[0] + '">' + m[1] + '</span>' +
             '<span class="t">' + esc(it.text) + '<div class="v">' + extra + '</div></span></div>';
    }).join('') +
    '<div class="sum">可自动判分 <b>' + max + '</b> 分，实得 <b>' + shown + '</b> 分' +
    (d.todo ? '；另有 ' + d.todo + ' 项待人工核对' : '') + '</div>';
}

renderTabs();
renderList();
</script>
</body>
</html>
