<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 操作题 · 分类练习与判分</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b;
          --blue:#1b5c96; --green:#15803d; --red:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.7 "Microsoft YaHei",sans-serif; }
  .head { background:linear-gradient(135deg,#0f172a,#1e293b); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .head h1 { font-size:16px; margin:0; }
  .head a { margin-left:auto; color:#cbd5e1; text-decoration:none; font-size:13px; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px 14px 60px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:#fff; color:#334155; padding:8px 16px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:13.5px; }
  .tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .card h2 { font-size:14.5px; margin:0 0 10px; color:var(--blue); }
  .hint { color:var(--muted); font-size:12.5px; line-height:1.95; }
  .hint b { color:#334155; }
  .q { border-top:1px solid #eef2f6; padding:12px 0; display:flex; gap:12px; align-items:flex-start; }
  .q:first-of-type { border-top:none; }
  .q .no { width:104px; flex-shrink:0; }
  .q .no b { display:block; font-size:13.5px; }
  .q .no span { color:var(--muted); font-size:11.5px; }
  .q .body { flex:1; min-width:0; }
  .q .body ul { margin:0; padding:0; }
  .q .body li { color:#334155; font-size:12.5px; line-height:1.85; list-style:none; position:relative; padding-left:11px; }
  .q .body li::before { content:'·'; position:absolute; left:0; color:#94a3b8; }
  .q .acts { display:flex; flex-direction:column; gap:6px; width:116px; flex-shrink:0; }
  .q .acts a, .q .acts button { display:inline-flex; align-items:center; justify-content:center; height:30px; border-radius:7px; font-size:12.5px; text-decoration:none; cursor:pointer; font-family:inherit; border:1px solid #cbd5e1; background:#f8fafc; color:#334155; }
  .q .acts a { background:#eff6ff; border-color:#bfdbfe; color:#1b5c96; }
  .q .acts a:hover { background:#dbeafe; }
  .q .acts .badge { font-size:11px; color:var(--muted); text-align:center; }
  .gt { font-size:13.5px; font-weight:700; color:#12385c; padding:6px 0 2px; border-bottom:1px dashed #dbe4ee; }
  .gt .gs { font-weight:400; font-size:11.5px; color:#64748b; }
  .result { display:none; margin-top:10px; border:1px solid #dbeafe; background:#f8fbff; border-radius:10px; padding:12px 14px; }
  .result.on { display:block; }
  .result h3 { margin:0 0 8px; font-size:13.5px; color:#0c4a6e; }
  .r { display:flex; gap:8px; padding:5px 0; border-top:1px dashed #e2e8f0; font-size:12.5px; }
  .r:first-of-type { border-top:none; }
  .r .m { width:16px; font-weight:700; }
  .r .t { flex:1; line-height:1.75; }
  .r .v { color:#64748b; font-size:11.5px; }
  .ok{color:var(--green)} .bad{color:var(--red)} .todo{color:#b45309}
  .sum { margin-top:8px; padding-top:8px; border-top:2px solid #dbeafe; font-size:13px; }
  .sum b { font-size:20px; color:var(--blue); }
  @media (max-width:640px) {
    .q { flex-wrap:wrap; }
    .q .acts { flex-direction:row; width:100%; }
    .q .acts a, .q .acts button { flex:1; }
    .q .no { width:auto; }
  }
</style>
</head>
<body>
<div class="head">
  <h1>Windows 操作题</h1>
  <a href="/">← 回到题库</a>
</div>

<div class="wrap">
  <div class="card">
    <h2>怎么用</h2>
    <div class="hint">
      每道题后面有【下载程序】——只下这道题要用的那一个（1 个 exe + 同目录配置，一百多 KB）。<br>
      解压 → 按题目改设置 → 双击 exe 打开仿真控制面板做完 → 关掉 → 把同目录生成的那个<b>同名无扩展名文件</b>传上来判分。<br>
      <b style="color:#b45309">同一个类型只下一次就够了</b>：比如第 10、24、289 题都是「Internet 选项」，下一份 iesxWin7 就够，后面这些题直接用同一个程序做完再上传，不用每题重复下载。
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="on" data-k="网络">网络（{{ sections['网络']|length }} 题）</button>
    <button data-k="Windows">Windows（{{ sections['Windows']|length }} 题）</button>
    <button data-k="专项练习">专项练习（{{ practice_total }} 题）</button>
  </div>

  <div class="card" id="list"></div>
</div>

<input type="file" id="picker" style="display:none">

<script>
const DATA = {{ sections|tojson }};
const PRACTICE = {{ practice_groups|tojson }};
let curSection = '网络';
const PROG_NAME = {
  iesxWin7:'Internet 选项', wangluoWin7:'网络/IPv4', bhsxWin7:'宽带连接', jlljWin7:'连接向导',
  qyszWin7:'区域和语言', rwlsxWin7:'任务栏', xianshiWin7:'显示/主题', srfWin7:'输入法',
  tjdyjWin7:'打印机', outlook:'邮件'
};

function renderTabs() {
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.k === curSection);
    b.onclick = () => { curSection = b.dataset.k; renderTabs(); renderList(); };
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderList() {
  if (curSection === '专项练习') { renderPractice(); return; }
  const rows = DATA[curSection] || [];
  document.getElementById('list').innerHTML = '<h2>' + curSection + '（' + rows.length + ' 题）</h2>' +
    rows.map(q => {
      const items = q.texts.map(t => '<li>' + esc(t) + '</li>').join('');
      return '<div class="q" id="q' + q.qid + '">' +
        '<div class="no"><b>第 ' + q.qid + ' 题</b><span>' + q.score + ' 分 · ' + (PROG_NAME[q.prog] || q.prog) + '</span></div>' +
        '<div class="body"><ul>' + items + '</ul>' +
        '<div class="result" id="r' + q.qid + '"></div></div>' +
        '<div class="acts">' +
        '<a href="/windows/prog/' + q.prog + '.zip">下载程序</a>' +
        '<button onclick="pick(' + q.qid + ')">上传判分</button>' +
        '<div class="badge">可判 ' + q.total + ' 项</div>' +
        '</div></div>';
    }).join('');
}

function qCard(q) {
  const items = q.texts.map(t => '<li>' + esc(t) + '</li>').join('');
  const id = String(q.id);
  return '<div class="q" id="q' + id + '">' +
    '<div class="no"><b>' + esc(q.title || ('第 ' + q.qid + ' 题')) + '</b><span>' + q.score + ' 分 · ' + (PROG_NAME[q.prog] || q.prog) + '</span></div>' +
    '<div class="body"><ul>' + items + '</ul><div class="result" id="r' + id + '"></div></div>' +
    '<div class="acts">' +
    '<a href="/windows/prog/' + q.prog + '.zip">下载程序</a>' +
    '<button onclick="pick(\'' + id + '\')">上传判分</button>' +
    '<div class="badge">可判 ' + q.total + ' 项</div>' +
    '</div></div>';
}

function renderPractice() {
  const groups = PRACTICE || [];
  document.getElementById('list').innerHTML = '<h2>专项练习（每个程序 5 题，每题 1 分）</h2>' +
    groups.map(g => '<div style="margin-top:14px"><div class="gt">' + esc(PROG_NAME[g.prog] || g.prog) +
      '　<span class="gs">' + g.items.length + ' 题 · ' + esc(g.prog) + '.exe</span></div>' +
      g.items.map(qCard).join('') + '</div>').join('');
}

let pendingQid = null;
const picker = document.getElementById('picker');
picker.onchange = () => {
  if (picker.files.length && pendingQid) upload(picker.files[0], pendingQid);
  picker.value = '';
};
function pick(qid) { pendingQid = String(qid); picker.click(); }

async function upload(f, qid) {
  const box = document.getElementById('r' + String(qid));
  box.classList.add('on');
  box.innerHTML = '<h3>正在读取 ' + esc(f.name) + ' …</h3>';
  const fd = new FormData();
  fd.append('file', f);
  fd.append('qid', String(qid));
  try {
    const r = await fetch('/api/windows/check', { method:'POST', body: fd });
    const d = await r.json();
    if (!r.ok) { box.innerHTML = '<h3 class="bad">' + esc(d.error || '判分失败') + '</h3>'; return; }
    renderResult(box, d);
  } catch (e) {
    box.innerHTML = '<h3 class="bad">上传失败：' + esc(e) + '</h3>';
  }
}

function renderResult(box, d) {
  const max = d.full || 0;
  const shown = d.score;
  const map = { ok:['ok','✓'], bad:['bad','✗'], todo:['todo','·'] };
  box.innerHTML = '<h3>' + esc(d.title) + ' · 得分 ' + shown + ' / ' + max + '（卷面 ' + (d.total_score || 10) + ' 分）</h3>' +
    d.items.filter(it => it.status !== 'step').map(it => {
      const m = map[it.status] || ['todo','·'];
      let extra;
      if (it.status === 'ok') extra = '当前值：' + esc(it.actual);
      else if (it.status === 'bad') extra = '当前值 ' + esc(it.actual) + '　要求 ' + esc(it.expect);
      else extra = '待人工核对（未配置比对值）';
      return '<div class="r"><span class="m ' + m[0] + '">' + m[1] + '</span>' +
             '<span class="t">' + esc(it.text) + '<div class="v">' + extra + '</div></span></div>';
    }).join('') +
    '<div class="sum">可自动判分 <b>' + max + '</b> 分，实得 <b>' + shown + '</b> 分' +
    (d.todo ? '；另有 ' + d.todo + ' 项待人工核对' : '') + '</div>';
}

renderTabs();
renderList();
</script>
</body>
</html>
