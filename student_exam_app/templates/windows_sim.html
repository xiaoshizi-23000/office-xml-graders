<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制面板 · Internet 选项仿真（Windows 7）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #4d7397;
    font-family: "宋体", SimSun, "Microsoft YaHei", sans-serif; font-size: 12px; color: #000;
    display: flex; flex-direction: column; align-items: center; padding: 20px 10px 40px;
  }
  .bar { width: 794px; max-width: 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: #eaf3fb; font-size: 12px; }
  .bar a { margin-left: auto; color: #dbeaf7; text-decoration: none; }

  /* ===== 控制面板窗口 ===== */
  .panelwin {
    width: 794px; max-width: 100%; background: #fff; border: 1px solid #7f9db9;
    box-shadow: 0 10px 34px rgba(0,0,0,.45); border-radius: 3px; overflow: hidden;
  }
  .cap {
    height: 26px; display: flex; align-items: center; padding: 0 3px 0 6px;
    background: linear-gradient(180deg,#f2f8fd,#dbe9f7 45%,#c8dcef);
    border-bottom: 1px solid #9db4c9; font-size: 12px;
  }
  .cap .ico { width: 15px; height: 15px; margin-right: 5px; background: #2f7fd0; border-radius: 2px; }
  .cap .sys { margin-left: auto; display: flex; gap: 1px; }
  .cap .sys i { width: 26px; height: 18px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 11px; color: #33506b; }
  .cap .sys i:hover { background: rgba(255,255,255,.75); }
  .cap .sys i.x:hover { background: #d24a4a; color: #fff; }

  /* 工具栏面包屑 */
  .toolbar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #f0f4f8; border-bottom: 1px solid #d5e0ea; }
  .toolbar .nav { display: flex; gap: 2px; }
  .toolbar .nav span { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #eaf4ff, #9fc3e0); color: #245c8c; font-size: 11px; border: 1px solid #a9c3d8; }
  .crumb { display: flex; align-items: center; gap: 5px; color: #12385c; }
  .crumb b { font-weight: 400; }
  .toolbar .search { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .toolbar .search input { width: 210px; height: 21px; border: 1px solid #7a96b1; padding: 0 5px; font-family: inherit; font-size: 12px; }

  .content { padding: 16px 30px 26px; min-height: 430px; }
  .h1 { font-size: 15px; font-weight: 700; margin: 4px 0 18px; display: flex; align-items: baseline; gap: 12px; }
  .h1 .view { margin-left: auto; font-size: 12px; font-weight: 400; color: #1a4d78; }

  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 40px; }
  .cat { display: flex; gap: 10px; }
  .cat .icon { width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; }
  .cat .t { color: #1a6b2b; font-size: 13px; margin-bottom: 2px; }
  .cat a { display: block; color: #1c5fa8; text-decoration: none; line-height: 1.55; font-size: 12px; cursor: pointer; }
  .cat a:hover { text-decoration: underline; }

  /* ===== 网络和 Internet 页 ===== */
  .sub-layout { display: flex; gap: 0; min-height: 430px; }
  .sidenav { width: 170px; padding: 14px 10px 14px 18px; border-right: 1px solid #e6eef6; }
  .sidenav a { display: block; color: #0b5ea8; text-decoration: none; padding: 3px 0; font-size: 12px; cursor: pointer; }
  .sidenav a.on { color: #000; font-weight: 700; }
  .sidenav a:hover { text-decoration: underline; }
  .subbody { flex: 1; padding: 14px 20px; }
  .subbody h2 { font-size: 14px; margin: 0 0 14px; color: #12385c; font-weight: 700; }
  .linklist a { display: block; color: #1c5fa8; text-decoration: none; padding: 5px 0; font-size: 12.5px; cursor: pointer; }
  .linklist a:hover { text-decoration: underline; }
  .linklist .d { color: #555; font-size: 11.5px; margin-left: 8px; }

  /* ===== Internet 属性 对话框（覆盖层） ===== */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.26); display: none; align-items: center; justify-content: center; z-index: 60; }
  .overlay.on { display: flex; }
  .dlg { width: 404px; background: #f0f0f0; border: 1px solid #6f7f8f; box-shadow: 0 12px 34px rgba(0,0,0,.5); border-radius: 3px; }
  .dlg .cap { background: linear-gradient(180deg,#f2f8fd,#c9dcf0); }
  .tabs { display: flex; padding: 6px 8px 0; }
  .tabs button { font-family: inherit; font-size: 12px; padding: 3px 10px 2px; cursor: pointer; border: 1px solid #9aa8b5; border-bottom: none; background: #eceff2; border-radius: 2px 2px 0 0; margin-right: 1px; position: relative; top: 1px; }
  .tabs button.on { background: #f0f0f0; top: 0; padding-bottom: 3px; }
  .panel { border-top: 1px solid #9aa8b5; padding: 8px 10px 4px; max-height: 70vh; overflow: auto; }

  .grp { padding: 2px 0 8px; border-bottom: 1px solid #dcdcdc; margin-bottom: 6px; }
  .grp:last-of-type { border-bottom: none; }
  .grp .top { display: flex; gap: 6px; }
  .grp .ico { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .grp .body { flex: 1; min-width: 0; }
  .grp .ttl { font-weight: 700; margin: 2px 0 3px; }
  .grp .desc { color: #333; line-height: 1.6; margin-bottom: 5px; }
  textarea { width: 100%; height: 46px; border: 1px solid #7a96b1; padding: 3px 4px; resize: none; font-family: inherit; font-size: 12px; background: #fff; }
  button.w7 { font-family: inherit; font-size: 12px; height: 22px; min-width: 62px; padding: 0 9px; cursor: pointer; border: 1px solid #a9bfd3; border-radius: 2px; background: linear-gradient(180deg,#fdfefe,#eef4fa 45%,#dfeaf5); }
  button.w7:hover { border-color: #7ba7cc; }
  .btnrow { display: flex; gap: 5px; justify-content: flex-end; margin-top: 4px; }
  .btnrow.left { justify-content: flex-start; }
  .chk { display: flex; align-items: center; gap: 4px; margin: 2px 0 4px; }
  .foot { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 10px 10px; }
  .foot button { min-width: 75px; height: 23px; }

  .sub2 { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; align-items: center; justify-content: center; z-index: 70; }
  .sub2.on { display: flex; }
  .subdlg { width: 372px; background: #f0f0f0; border: 1px solid #6f7f8f; box-shadow: 0 10px 26px rgba(0,0,0,.45); border-radius: 3px; }
  .subdlg .body { padding: 10px 12px 4px; }
  .subdlg fieldset { border: 1px solid #cfd8e0; border-radius: 3px; padding: 8px 10px 10px; margin: 0 0 10px; }
  .subdlg legend { padding: 0 4px; color: #1d3f60; }
  .subdlg .radios label { display: block; margin: 2px 0; }
  .subdlg input[type=number] { height: 19px; border: 1px solid #7a96b1; font-family: inherit; font-size: 12px; padding: 0 3px; width: 56px; }
  .subdlg .foot { padding: 6px 10px 10px; }

  .result { width: 794px; max-width: 100%; margin-top: 14px; background: #fff; border: 1px solid #c9d6e2; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,.22); display: none; }
  .result h2 { margin: 0 0 8px; font-size: 13px; color: #1d3f60; font-family: "Microsoft YaHei", sans-serif; }
  .r-item { display: flex; gap: 6px; padding: 5px 0; border-top: 1px dashed #e6ecf2; font-family: "Microsoft YaHei", sans-serif; font-size: 12px; }
  .r-item:first-of-type { border-top: none; }
  .mark { width: 14px; font-weight: 700; }
  .ok { color: #1a7f37; } .bad { color: #c0392b; }
  .r-item .txt { flex: 1; line-height: 1.7; }
  .r-item .val { color: #667788; font-size: 11.5px; }
  .total { margin-top: 8px; padding-top: 8px; border-top: 2px solid #e2e8ef; display: flex; align-items: baseline; gap: 5px; font-family: "Microsoft YaHei", sans-serif; }
  .total b { font-size: 22px; color: #1b5c96; }
  .tips { margin-top: 8px; padding: 7px 9px; background: #fcf8e3; border: 1px solid #faebcc; color: #8a6d3b; font-size: 11.5px; line-height: 1.8; font-family: "Microsoft YaHei", sans-serif; }

  @media (max-width: 820px) {
    .panelwin { width: 100%; }
    .cats { grid-template-columns: 1fr; }
    .content { padding: 12px 16px 20px; }
    .sub-layout { flex-direction: column; }
    .sidenav { width: auto; border-right: none; border-bottom: 1px solid #e6eef6; }
    .dlg { width: 94vw; }
  }
</style>
</head>
<body>

<div class="bar">
  <span>仿真练习 · 控制面板 → Internet 选项（照判分程序窗口复刻）</span>
  <a href="/windows">← 清单判分</a>
</div>

<div class="panelwin">
  <div class="cap"><span class="ico"></span>控制面板
    <span class="sys"><i>—</i><i>▢</i><i class="x">✕</i></span>
  </div>

  <div class="toolbar">
    <div class="nav"><span>◀</span><span>▶</span></div>
    <div class="crumb" id="crumb">🖥 <b id="crumbText">控制面板</b></div>
    <div class="search"><input placeholder="搜索控制面板"><span>🔍</span></div>
  </div>

  <div class="content" id="content"></div>
</div>

<div class="result" id="result">
  <h2>检查结果（10 分）</h2>
  <div id="items"></div>
  <div class="total"><b id="score">0</b><span>/ 10 分</span></div>
  <div class="tips" id="tips"></div>
</div>

<!-- Internet 属性 -->
<div class="overlay" id="overlay">
  <div class="dlg">
    <div class="cap"><span class="ico"></span>Internet 属性
      <span class="sys"><i>—</i><i>▢</i><i class="x" onclick="closeIE()">✕</i></span>
    </div>
    <div class="tabs" id="tabs">
      <button class="on" data-t="0">常规</button>
      <button data-t="1">安全</button>
      <button data-t="2">隐私</button>
      <button data-t="3">内容</button>
      <button data-t="4">连接</button>
      <button data-t="5">程序</button>
      <button data-t="6">高级</button>
    </div>
    <div class="panel" id="panel"></div>
    <div class="foot">
      <button class="w7" onclick="grade()">确定</button>
      <button class="w7" onclick="closeIE()">取消</button>
      <button class="w7" onclick="grade()">应用(A)</button>
    </div>
  </div>
</div>

<!-- 浏览历史记录 → 设置 -->
<div class="sub2" id="sub2">
  <div class="subdlg">
    <div class="cap"><span class="ico"></span>Internet 临时文件和历史记录设置
      <span class="sys"><i class="x" onclick="closeSub()">✕</i></span>
    </div>
    <div class="body">
      <fieldset><legend>检查所存网页的较新版本</legend>
        <div class="radios">
          <label><input type="radio" name="chk"> 每次访问此页时检查(E)</label>
          <label><input type="radio" name="chk" checked> 每次启动 Internet Explorer 时检查(A)</label>
          <label><input type="radio" name="chk"> 自动(D)</label>
          <label><input type="radio" name="chk"> 不检查(N)</label>
        </div>
      </fieldset>
      <fieldset><legend>使用的磁盘空间</legend>
        <div>要使用的磁盘空间(8-1024MB)(D)：<input type="number" value="250"> MB</div>
      </fieldset>
      <fieldset><legend>历史记录</legend>
        <div>在网页保存在历史记录中的天数(D)：<input type="number" id="days" min="0" max="999" value="20"></div>
      </fieldset>
    </div>
    <div class="foot">
      <button class="w7" onclick="closeSub()">确定</button>
      <button class="w7" onclick="closeSub()">取消</button>
    </div>
  </div>
</div>

<script>
const state = { homepage: 'http://go.microsoft.com/fwlink/?LinkId=69157', days: 20, clearOnExit: false };

const CATS = [
  [['🛡️', '系统和安全', ['查看您的计算机状态', '备份您的计算机', '查找并解决问题']],
   ['👥', '用户帐户和家庭安全', ['添加或删除用户帐户', '为所有用户设置家长控制']]],
  [['🌐', '网络和 Internet', ['查看网络状态和任务', '选择家庭组和共享选项']],
   ['🎨', '外观和个性化', ['更改主题', '更改桌面背景', '调整屏幕分辨率']]],
  [['🔊', '硬件和声音', ['查看设备和打印机', '添加设备']],
   ['🕐', '时钟、语言和区域', ['更改键盘或其他输入法', '更改显示语言']]],
  [['📦', '程序', ['卸载程序']],
   ['♿', '轻松访问', ['使用 Windows 建议的设置', '优化视频显示']]]
];

function renderHome() {
  document.getElementById('crumbText').textContent = '控制面板';
  let html = '<div class="h1">调整计算的设置<span class="view">查看方式：类别 ▾</span></div><div class="cats">';
  CATS.forEach(row => row.forEach(c => {
    html += '<div class="cat"><div class="icon">' + c[0] + '</div><div><div class="t">' + c[1] + '</div>';
    c[2].forEach(link => {
      const isNet = link.indexOf('网络状态') >= 0;
      html += '<a' + (isNet ? ' onclick="goNetwork()"' : '') + '>' + link + '</a>';
    });
    html += '</div></div>';
  }));
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function goNetwork() {
  document.getElementById('crumbText').innerHTML = '控制面板 &gt; 网络和 Internet';
  document.getElementById('content').innerHTML = `
    <div class="sub-layout">
      <div class="sidenav">
        <a onclick="renderHome()">控制面板主页</a>
        <a>系统和安全</a>
        <a class="on">网络和 Internet</a>
        <a>硬件和声音</a>
        <a>程序</a>
        <a>用户帐户和家庭安全</a>
        <a>外观和个性化</a>
        <a>时钟、语言和区域</a>
        <a>轻松访问</a>
      </div>
      <div class="subbody">
        <h2>网络和 Internet</h2>
        <div class="linklist">
          <a>网络和共享中心<span class="d">查看网络状态和任务</span></a>
          <a>家庭组和共享选项<span class="d">选择要共享的内容</span></a>
          <a onclick="openIE()">Internet 选项<span class="d">更改 Internet 设置</span></a>
        </div>
        <div style="margin-top:26px;color:#666;font-size:11.5px;line-height:1.9">
          练习题：点上面的「Internet 选项」，按要求改设置，改完点「确定」自动判分。
        </div>
      </div>
    </div>`;
}

/* ===== Internet 属性 ===== */
const STUB = t => () => '<div style="color:#333;line-height:1.9;padding:6px 4px 40px">' + t +
  '<div style="color:#667788;margin-top:8px">本题考点在「常规」页。</div></div>';

function renderGeneral() {
  return `
    <div class="grp"><div class="top"><div class="ico">🏠</div><div class="body">
      <div class="ttl">主页</div>
      <div class="desc">若要在主页选项卡上创建主页，请在地址栏中键入地址(R)。</div>
      <textarea id="hp">${state.homepage.replace(/</g,'&lt;')}</textarea>
      <div class="btnrow">
        <button class="w7" onclick="setHome('cur')">使用当前页(C)</button>
        <button class="w7" onclick="setHome('def')">使用默认值(D)</button>
        <button class="w7" onclick="setHome('blank')">使用空白页(B)</button>
      </div></div></div></div>

    <div class="grp"><div class="top"><div class="ico">🕘</div><div class="body">
      <div class="ttl">浏览历史记录</div>
      <div class="desc">删除临时文件、历史记录、Cookie、保存的密码和网页表单信息。</div>
      <label class="chk"><input type="checkbox" id="clr" ${state.clearOnExit ? 'checked' : ''}>退出时删除浏览历史记录(D)</label>
      <div class="btnrow">
        <button class="w7" onclick="alert('真实程序会弹出“删除浏览历史记录”对话框。')">删除(D)…</button>
        <button class="w7" onclick="openSub()">设置(S)</button>
      </div></div></div></div>

    <div class="grp"><div class="top"><div class="ico">🔍</div><div class="body">
      <div class="ttl">搜索</div><div class="desc">更改搜索默认值。</div>
      <div class="btnrow"><button class="w7" onclick="alert('真实程序会打开搜索设置对话框。')">设置(I)</button></div>
    </div></div></div>

    <div class="grp"><div class="top"><div class="ico">🗂️</div><div class="body">
      <div class="ttl">选项卡</div><div class="desc">更改网页在选项卡中显示的方式。</div>
      <div class="btnrow"><button class="w7" onclick="alert('真实程序会打开选项卡浏览设置。')">设置(T)</button></div>
    </div></div></div>

    <div class="grp"><div class="top"><div class="ico"></div><div class="body">
      <div class="ttl">外观</div>
      <div class="btnrow left">
        <button class="w7">颜色(O)</button><button class="w7">语言(L)</button>
        <button class="w7">字体(N)</button><button class="w7">辅助功能(E)</button>
      </div></div></div></div>`;
}

const PAGES = [
  { render: renderGeneral },
  { render: STUB('四个区域的安全级别：Internet、本地 Intranet、受信任的站点、受限制的站点。') },
  { render: STUB('为 Internet 区域选择隐私设置，可配置弹出窗口阻止程序。') },
  { render: STUB('内容审查程序、证书、自动完成、源和网页快讯。') },
  { render: STUB('拨号和虚拟专用网络设置、局域网(LAN)设置。') },
  { render: STUB('为每个 Internet 服务选择要使用的程序。') },
  { render: STUB('高级设置：HTTP 1.1、安全、打印、多媒体、辅助功能等。') }
];

function openIE() {
  document.getElementById('overlay').classList.add('on');
  document.getElementById('panel').innerHTML = PAGES[0].render();
}
function closeIE() { document.getElementById('overlay').classList.remove('on'); }

function sync() {
  const hp = document.getElementById('hp');
  if (hp) state.homepage = hp.value.trim();
  const c = document.getElementById('clr');
  if (c) state.clearOnExit = c.checked;
  const d = document.getElementById('days');
  if (d) state.days = parseInt(d.value || '0', 10);
}

function setHome(k) {
  document.getElementById('hp').value = { cur: 'http://go.microsoft.com/fwlink/?LinkId=69157',
    def: 'http://go.microsoft.com/fwlink/?LinkId=69157', blank: 'about:blank' }[k];
}
function openSub() { sync(); document.getElementById('days').value = state.days; document.getElementById('sub2').classList.add('on'); }
function closeSub() { sync(); document.getElementById('sub2').classList.remove('on'); }

document.querySelectorAll('#tabs button').forEach((b, i) => b.addEventListener('click', () => {
  sync();
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('panel').innerHTML = PAGES[i].render();
}));

const RULE = [
  { name: '设置主页为 www.svtcc.edu.cn', score: 4, tip: '常规页顶部文本框',
    check: s => norm(s.homepage) === 'www.svtcc.edu.cn' },
  { name: '网页保存在历史记录中的天数设为 20', score: 3, tip: '常规 → 浏览历史记录 → 设置(S) → 子弹窗底部',
    check: s => s.days === 20 },
  { name: '退出时删除浏览历史记录', score: 3, tip: '常规页“浏览历史记录”区域的复选框',
    check: s => s.clearOnExit === true }
];
function norm(v) { return String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/+$/, ''); }

function grade() {
  sync();
  let total = 0, html = '';
  RULE.forEach(r => {
    const ok = r.check(state);
    if (ok) total += r.score;
    html += '<div class="r-item"><span class="mark ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✗') + '</span>' +
            '<span class="txt"><div>' + r.name + '（' + r.score + ' 分）</div><div class="val">' +
            (ok ? '已设置正确' : '未完成：' + r.tip) + '</div></span>' +
            '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? r.score : 0) + '/' + r.score + '</span></div>';
  });
  const box = document.getElementById('result');
  document.getElementById('items').innerHTML = html;
  document.getElementById('score').textContent = total;
  box.style.display = 'block';
  document.getElementById('tips').textContent = total === 10
    ? '满分。真实考试改完要点「应用」再点「确定」，只关窗口不会保存。'
    : '三项都在 Internet 属性 → 常规页。历史天数要先点“浏览历史记录”里的「设置(S)」。';
  closeIE();
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

renderHome();
document.getElementById('panel').addEventListener('input', sync);
</script>
</body>
</html>
